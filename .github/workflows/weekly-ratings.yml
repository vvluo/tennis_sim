name: Weekly ratings refresh

on:
  schedule:
    - cron: '17 6 * * 1'      # Mondays 06:17 UTC
  workflow_dispatch:           # and on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with deploy-site.yml so the two can never deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The page runs simulation/engine.js, a hand port of the Python engine.
      # This drives both off one shared random stream and requires identical
      # records, so a port that has drifted fails the build before it deploys.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Engine parity (Python vs JS)
        env:
          PARITY_REQUIRE_NODE: '1'      # a missing node must fail, not skip
        run: pip install pytest && python -m pytest tests/test_engine_parity.py tests/test_constants_parity.py -q

      # The cache is what makes this affordable. Warm, a run costs ~8 API calls;
      # cold, it re-pulls the whole year for ~425 and four cold runs would blow
      # the monthly trial quota. restore-keys falls back to the newest earlier
      # cache, so a run only starts cold if none exists at all.
      - uses: actions/cache@v4
        with:
          path: sportradar_cache
          key: sportradar-${{ github.run_id }}
          restore-keys: sportradar-

      # A stored secret cannot be read back, so the only way to know it is
      # wired is to look at it from inside a run. Length only -- never the value.
      - name: Check the key is wired
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          if [ -z "$SPORTRADAR_API_KEY" ]; then
            echo "::error::SPORTRADAR_API_KEY is empty. Check it is a *repository* secret"
            echo "(not an environment secret, and not a variable) named exactly that."
            exit 1
          fi
          echo "key is present: ${#SPORTRADAR_API_KEY} characters"

      - name: Build ratings
        env:
          # Injected by GitHub from the repository secret. Never in the repo.
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          # The tier is in the URL, so it has to match the key. Not sensitive,
          # so it is a repository *variable*; unset, it stays on trial.
          SPORTRADAR_ACCESS_LEVEL: ${{ vars.SPORTRADAR_ACCESS_LEVEL || 'trial' }}
        run: python build_ratings.py --budget 60 --prune

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
