<title>Play a Grand Slam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F8FA;
  --page:#13297F; --page-ink:#FFFFFF; --page-muted:rgba(255,255,255,.68);
  --ink:#101F2B; --ink-2:#3A5062; --muted:#697F92; --line:#D3DDE5;
  --accent:#1D6FA3; --accent-soft:#D6E7F2;
  --atp:#1D6FA3; --atp-soft:#DCEAF4;
  --wta:#C18DE8; --wta-ink:#7A3CB8; --wta-soft:#EFE2FA;
  --thin:#9A6B12; --thin-soft:#F5E9CE;
  --bar-track:#E1E9EF;
  --hold:#2E7D46; --hold-soft:#DEEFE4;
  --brk:#B03A34;  --brk-soft:#F6E1DF;
  --tbk:#8A6612;  --tbk-soft:#F5EBCC;
  --diamond:#2E8CA6; --diamond-soft:#D6EFF5;
  --gold:#9A7414; --gold-soft:#F6ECCF;
  --silver:#5F6E7C; --silver-soft:#E4E9ED;
  --bronze:#8A5527; --bronze-soft:#F1E2D5;
  --shadow:0 1px 2px rgba(16,31,43,.06),0 8px 24px -12px rgba(16,31,43,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C141C; --surface:#141F2A; --surface-2:#18242F;
    --page:#13297F; --page-ink:#FFFFFF; --page-muted:rgba(255,255,255,.68);
    --ink:#E5ECF2; --ink-2:#B3C4D1; --muted:#7D93A5; --line:#25333F;
    --accent:#57A6D9; --accent-soft:#1B3446;
    --atp:#57A6D9; --atp-soft:#17303F;
    --wta:#C79BEC; --wta-ink:#D0A9F1; --wta-soft:#2C1B40;
    --thin:#D6A94A; --thin-soft:#33280F;
    --bar-track:#1E2C38;
    --hold:#74CE8E; --hold-soft:#152C1D;
    --brk:#EA8B83;  --brk-soft:#301715;
    --tbk:#DFB452;  --tbk-soft:#332810;
    --diamond:#7FD4E8; --diamond-soft:#123642;
    --gold:#E0B450; --gold-soft:#3A2E10;
    --silver:#AEBCC7; --silver-soft:#232E38;
    --bronze:#D08F5C; --bronze-soft:#3A2515;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0C141C; --surface:#141F2A; --surface-2:#18242F;
  --page:#13297F; --page-ink:#FFFFFF; --page-muted:rgba(255,255,255,.68);
  --ink:#E5ECF2; --ink-2:#B3C4D1; --muted:#7D93A5; --line:#25333F;
  --accent:#57A6D9; --accent-soft:#1B3446;
  --atp:#57A6D9; --atp-soft:#17303F;
  --wta:#C79BEC; --wta-ink:#D0A9F1; --wta-soft:#2C1B40;
  --thin:#D6A94A; --thin-soft:#33280F;
  --bar-track:#1E2C38;
  --hold:#74CE8E; --hold-soft:#152C1D;
  --brk:#EA8B83;  --brk-soft:#301715;
  --tbk:#DFB452;  --tbk-soft:#332810;
  --diamond:#7FD4E8; --diamond-soft:#123642;
  --gold:#E0B450; --gold-soft:#3A2E10;
  --silver:#AEBCC7; --silver-soft:#232E38;
  --bronze:#D08F5C; --bronze-soft:#3A2515;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{padding:28px clamp(24px,5vw,64px) 60px}
h1{font-size:clamp(24px,3.4vw,34px);font-weight:700;letter-spacing:-.02em;margin:0 0 4px;
  color:var(--page-ink);display:flex;align-items:center;gap:.32em}
.ball{width:.78em;height:.78em;flex:none;transform:rotate(-22deg)}
.titlerow{display:flex;align-items:center;gap:16px}
.navbar{display:flex;align-items:center;gap:9px;margin-left:auto}
.navlink{display:flex;align-items:center;padding:7px 14px;border-radius:99px;
  font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;
  color:var(--page-ink);background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.28);transition:background .15s}
.navlink:hover{background:rgba(255,255,255,.20)}
.themebtn{flex:none;display:flex;align-items:center;gap:7px;padding:7px 13px;
  font:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:99px;
  color:var(--page-ink);background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.28);transition:background .15s}
.themebtn:hover{background:rgba(255,255,255,.20)}
.headline{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;box-shadow:var(--shadow)}
.card .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.card.you .v{color:var(--accent)}
button.card{font:inherit;text-align:left;cursor:pointer}
button.card:hover{border-color:var(--accent)}
button.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.jump{font-size:13px;opacity:.65}
/* brief ring so the eye lands on the right tie after the jump */
.tie.flash{box-shadow:0 0 0 2px var(--accent)}
.sims{margin:14px 0 0;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.sims summary{cursor:pointer;padding:11px 14px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);list-style:none}
.sims summary::-webkit-details-marker{display:none}
.sims summary::before{content:"\25B6";display:inline-block;margin-right:8px;font-size:9px;
  color:var(--muted);transition:transform .15s}
.sims[open] summary::before{transform:rotate(90deg)}
.simbody{border-top:1px solid var(--line);padding:10px 14px 14px}
.simhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;font-size:11px;
  color:var(--muted);margin-bottom:8px}
.simhead #cfgnote{margin-right:auto}
.linknote{margin:10px 2px 0;padding:9px 12px;border-radius:8px;font-size:12px;
  color:var(--page-ink);background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.26)}
.prompt{margin:0;padding:38px 20px;text-align:center;font-size:14px;
  color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);
  border-radius:10px}
/* The button is the only thing to do on arrival, so it says so. */
.run.waiting{animation:invite 2.6s ease-out infinite}
@keyframes invite{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}
  70%{box-shadow:0 0 0 13px rgba(255,255,255,0)}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
@media (prefers-reduced-motion:reduce){
  .run.waiting{animation:none;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
}
.copybtn:disabled{opacity:.45;cursor:default}
.copybtn:disabled:hover{color:var(--ink-2);border-color:var(--line)}
.copybtn{padding:10px 16px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;
  font-weight:600;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);transition:border-color .15s,color .15s}
.copybtn:hover{color:var(--ink);border-color:var(--accent)}
.linkbox{width:100%;margin:10px 0 0;padding:6px 9px;font:inherit;font-size:11.5px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
#simtable .link{font-size:11px;padding:2px 8px;cursor:pointer;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px}
#simtable .link:hover{color:var(--ink);border-color:var(--accent)}
.simclear{font:inherit;font-size:11px;padding:3px 10px;cursor:pointer;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px}
.simclear:hover{color:var(--ink);border-color:var(--accent)}
.simscroll{overflow-x:auto;max-height:260px;overflow-y:auto}
#simtable{width:100%;border-collapse:collapse;font-size:12.5px}
#simtable th{text-align:left;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);padding:0 10px 6px;white-space:nowrap}
#simtable td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
#simtable tr.replay{cursor:pointer}
#simtable tr.replay:hover td{background:var(--surface-2)}
#simtable tr.stale{color:var(--muted)}
#simtable tr.live td.champ{font-weight:700;color:var(--ink)}
#simtable .rng{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
#simtable .tourtag{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 5px;
  border-radius:4px;background:var(--accent-soft);color:var(--accent)}
#simtable .why{font-size:11px;color:var(--muted)}
.simempty{padding:6px 10px;font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--page-muted);margin:14px 2px 0}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin:10px 2px 0;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.14);
  font-size:11.5px;color:var(--page-muted)}
.foot a{color:var(--page-ink);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.32)}
.foot a:hover{border-bottom-color:var(--page-ink)}
.foot .copy{margin-left:auto;white-space:nowrap}
@media (max-width:560px){.foot .copy{margin-left:0}}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin:18px 0 4px;
  padding:14px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow)}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl.grow{flex:1 1 240px;min-width:200px}
.clab{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.segbtn{padding:8px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
  background:var(--surface-2);color:var(--muted);border:0;transition:background .15s,color .15s}
.segbtn+.segbtn{border-left:1px solid var(--line)}
.segbtn.on{background:var(--accent);color:var(--ground)}
.picker{position:relative}
#who{width:100%;box-sizing:border-box;padding:8px 30px 8px 11px;font:inherit;font-size:13px;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
#who:focus{outline:2px solid var(--accent);outline-offset:-1px}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;
  border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;border-radius:5px}
.clear:hover{background:var(--surface-2);color:var(--ink)}
.menu{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:240px;
  overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.45)}
.menu.open{display:block}
.opt{display:flex;gap:9px;align-items:baseline;padding:7px 11px;font-size:13px;cursor:pointer}
.opt:hover,.opt.active{background:var(--surface-2)}
.opt .rk{flex:none;min-width:30px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:11px;color:var(--muted)}
.opt .none{color:var(--muted);font-style:italic}
.opt.more{position:sticky;bottom:0;background:var(--surface-2);border-top:1px solid var(--line);cursor:default}
.opt.more:hover{background:var(--surface-2)}
.run{padding:10px 20px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;
  letter-spacing:-.01em;background:var(--accent);color:var(--ground);border:1px solid var(--accent);
  box-shadow:var(--shadow);min-width:190px;transition:opacity .15s,transform .15s}
.run:hover:not(:disabled){transform:translateY(-1px)}
.run:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);
  cursor:default;box-shadow:none}
.pager{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.pager.whole .pgbtn{display:none}
.pager.whole .prange{margin:0}
.pgbtn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:700;letter-spacing:-.01em;
  background:var(--accent);color:var(--ground);border:1px solid var(--accent);
  box-shadow:var(--shadow);transition:opacity .15s,transform .15s}
.pgbtn:hover:not(:disabled){transform:translateY(-1px)}
.pgbtn:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);
  cursor:default;box-shadow:none;opacity:.7}
.pgbtn .ar{font-size:11px}
.prange{margin:0 auto;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--page-ink);white-space:nowrap}
@media (max-width:640px){.pgbtn span:not(.ar){display:none}.pgbtn{padding:9px 13px}}
.scroll{overflow-y:auto;overflow-x:auto;max-height:78vh;padding:0 2px 10px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.bracket{display:flex;gap:10px;min-width:100%}
.round{flex:1 1 0;display:flex;flex-direction:column;min-width:0}
.ties{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.round h2{position:sticky;top:0;z-index:2;margin:0 0 4px;padding:6px 8px;background:var(--surface-2);
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tie{background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden;
  cursor:pointer;margin:3px 0}
.tie:hover{border-color:var(--accent)}
.tie:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.side{display:flex;align-items:center;gap:6px;padding:4px 7px;font-size:12.5px;white-space:nowrap}
.side+.side{border-top:1px solid var(--line)}
.side.lost{color:var(--muted)}
.side.won .nm{font-weight:700;color:var(--ink)}
.side.me .nm{color:var(--accent)}
.seed{flex:none;min-width:19px;height:15px;border-radius:3px;background:var(--surface-2);color:var(--muted);
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:9.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
.seed.q{background:var(--accent-soft);color:var(--accent)}
.seed.blank{background:transparent}
.nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.sets{display:flex;gap:3px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;
  font-variant-numeric:tabular-nums}
.sets b{font-weight:500;min-width:11px;text-align:right;color:var(--muted)}
.sets b.setwon{font-weight:700;color:var(--ink)}
.sets sup{font-size:8px;font-weight:500;margin-left:.5px}
.overlay{position:fixed;inset:0;background:rgba(8,16,24,.55);display:none;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:820px;width:100%;
  max-height:86vh;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.mhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 18px;display:flex;align-items:center;gap:12px}
.mhead .t{font-weight:700;letter-spacing:-.01em}
.mhead .r{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mhead .s{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.close{border:0;background:var(--surface-2);color:var(--ink-2);border-radius:6px;width:26px;height:26px;
  cursor:pointer;font-size:15px;line-height:1}
.close:hover{background:var(--line)}
.mbody{padding:14px 18px 20px}
.setrow{margin-top:12px}
.setlabel{display:flex;gap:8px;align-items:baseline;font-size:10.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);padding-bottom:5px;border-bottom:1px solid var(--line)}
.setlabel .s{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:0;font-size:12.5px;color:var(--ink)}
.games{display:grid;grid-template-columns:repeat(var(--gamecols,2),1fr);gap:7px;margin-top:7px;align-items:start}
/* Every tiebreak point carries both names, which will not fit a 198px column
   without wrapping onto two or three lines. Give it the whole row. */
.game.tbk{grid-column:1/-1}
.game.tbk .pt .sc{margin-left:24px}
.game{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;background:var(--surface-2);overflow:hidden}
.game.hold{border-left-color:var(--hold);background:var(--hold-soft)}
.game.brk{border-left-color:var(--brk);background:var(--brk-soft)}
.game.tbk{border-left-color:var(--tbk);background:var(--tbk-soft)}
.ghead{display:flex;align-items:center;gap:7px;width:100%;padding:6px 9px;font:inherit;font-size:11px;
  color:var(--muted);background:transparent;border:0;cursor:pointer;text-align:left;
  white-space:nowrap}
/* One line whatever the names are, so a hold and a break are the same height.
   If something has to give it is the name, by ellipsis, never the line count. */
.ghead .srv,.ghead .gwin{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ghead .gchev,.ghead .gsc{flex:none}
.ghead b{color:var(--ink-2);font-weight:600}
.tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  flex:none;min-width:42px}
.game.hold .tag{color:var(--hold)}.game.brk .tag{color:var(--brk)}.game.tbk .tag{color:var(--tbk)}
.gwin{margin-left:auto;color:var(--ink-2);font-weight:600}
.gsc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gchev{font-size:8px;transition:transform .15s}.game.open .gchev{transform:rotate(90deg)}
.pts{display:none;padding:0 9px 7px}.game.open .pts{display:block}
.pt{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:1px 0}
.pt .who{display:flex;gap:4px;min-width:0;color:var(--ink-2)}
.pt .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .n{flex:none;color:var(--muted)}
.pt .sc{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.stats{margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats h3{margin:0;padding:8px 12px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);background:var(--surface-2);display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.stats h3 .who{color:var(--ink);letter-spacing:-.01em;text-transform:none;font-size:12.5px}
.srow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:4px 12px;font-size:12.5px}
.srow:nth-child(even){background:var(--surface-2)}
.srow .v{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--muted)}
.srow .v.l{text-align:left}.srow .v.r{text-align:right}
.srow .v.best{font-weight:700;color:var(--ink)}
.srow .k{color:var(--muted);text-align:center;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="titlerow">
    <h1 id="title"><svg class="ball" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="ballClip"><circle cx="12" cy="12" r="11"/></clipPath></defs><circle cx="12" cy="12" r="11" fill="#D9F02C"/><g clip-path="url(#ballClip)" fill="none" stroke="#FFF" stroke-width="1.7"><path d="M4.22 4.22C9.6 8 9.6 16 4.22 19.78"/><path d="M19.78 4.22C14.4 8 14.4 16 19.78 19.78"/></g></svg>Play a Grand Slam</h1>
    <div class="navbar">
      <a class="navlink" href="ratings_board.html">Tour Ratings Board</a>
      <button id="theme" class="themebtn" aria-label="Switch colour theme"></button>
    </div>
  </div>
  <div class="controls">
    <div class="ctl">
      <label class="clab" for="tourAtp">Tour</label>
      <div class="seg" role="group" aria-label="Tour">
        <button id="tourAtp" class="segbtn on" data-tour="ATP">ATP</button>

    </div>
    <div class="ctl grow">
      <label class="clab" for="who">You play as</label>
      <div class="picker">
        <input id="who" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search a player&hellip;" aria-label="Player you control">
        <button id="whoClear" class="clear" title="No player" aria-label="Clear">&times;</button>
        <div class="menu" id="whoMenu" role="listbox"></div>
      </div>
    </div>
    <button id="run" class="run">Simulate tournament</button>
    <button id="simlink" class="copybtn" type="button"
            title="Copy a link that reproduces this exact draw">Copy link</button>
  </div>
  <input class="linkbox" id="linkbox" readonly hidden aria-label="Shareable link">
  <div class="headline" id="headline"></div>
</header>

<div class="pager">
  <button class="pgbtn" id="prev"><span class="ar">&#9664;</span><span>Earlier rounds</span></button>
  <span class="prange" id="prange"></span>
  <button class="pgbtn" id="next"><span>Later rounds</span><span class="ar">&#9654;</span></button>
</div>
<p class="prompt" id="prompt" hidden></p>
<div class="scroll"><div class="bracket" id="bracket"></div></div>
<details class="sims" id="sims">
  <summary><span class="simcount" id="simcount">Saved simulations</span></summary>
  <div class="simbody">
    <div class="simhead">
      <span id="cfgnote"></span>
      <button class="simclear" id="simclear" type="button">Clear</button>
    </div>
    <div class="simscroll"><table id="simtable"></table></div>
  </div>
</details>
  <p class="linknote" id="linknote" hidden></p>
  <div class="legend">
    <span><span class="seed" style="display:inline-flex;vertical-align:-3px">1</span> seed</span>
    <span><span class="seed q" style="display:inline-flex;vertical-align:-3px">Q</span> qualifier</span>
    <span style="margin-left:auto">click any match for the point-by-point and statistics</span>
  </div>
  <footer class="foot">
    <span>Match data from <a href="https://www.sportradar.com" target="_blank"
      rel="noopener noreferrer">Sportradar</a>. Ratings and simulation are our own.</span>
    <span class="copy">&copy; 2026 | Aaron Guo</span>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="modal">
    <div class="mhead">
      <span class="r" id="mround"></span>
      <span class="t" id="mtitle"></span>
      <span class="s" id="mscore"></span>
      <button class="close" id="mclose" aria-label="Close">&times;</button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
/*__ENGINE__*/

const SRC = /*__DATA__*/;
const POOLS = SRC.pools;
// The date of the ratings this page was built from, shown against saved runs so
// an older one says which data set it was played under rather than just "older".
const BUILT = SRC.built;
const LABEL={R128:'Round of 128',R64:'Round of 64',R32:'Round of 32',R16:'Round of 16',QF:'Quarter-finals',SF:'Semi-finals',F:'Final'};

// D is one played-out tournament. It starts empty and is replaced every time
// the visitor presses Simulate; nothing is baked into the page.
let D = null;
// localStorage is scoped to the ORIGIN, not the path. On GitHub Pages every
// project under vvluo.github.io shares one store, so these keys are namespaced
// to avoid colliding with anything else published from the same account.
const NS = 'tennis:';

let tour = 'ATP';
// Shared with the ratings board. That page also offers "all", which means
// nothing to a draw, so it falls back to ATP here.
try {
  const saved = localStorage.getItem(NS + 'tour');
  if(saved === 'ATP' || saved === 'WTA') tour = saved;
} catch (e) { /* private window */ }
let playable = null;

function header(){
  document.getElementById('headline').innerHTML =
    '<div class="card"><div class="k">Champion</div><div class="v">' + D.champion +
    (D.championSeed ? ' <span style="color:var(--muted);font-weight:500">[' + D.championSeed + ']</span>' : '') + '</div></div>' +
    (D.playable ? '<button class="card you" id="youcard" ' +
      'title="Jump to their place in the draw">' +
      '<div class="k">You &mdash; ' + D.playable + '</div>' +
      '<div class="v">' + D.playableResult + ' <span class="jump">&#8594;</span></div>' +
      '</button>' : '');
  const card = document.getElementById('youcard');
  if(card) card.addEventListener('click', jumpToPlayable);
}

function seedBox(p){
  if(p.q) return '<span class="seed q">Q</span>';
  if(p.seed) return '<span class="seed">'+p.seed+'</span>';
  return '<span class="seed blank"></span>';
}
function setCells(m, which){
  const other = which==='top' ? 'bottom' : 'top';
  return '<span class="sets">' + m.setScores.map(s=>{
    const g = s[which];
    const sup = (s.tbSide===which) ? '<sup>'+s.tb+'</sup>' : '';
    // bold marks who took THAT set -- the match winner is shown by the name
    const won = s[which] > s[other] ? ' class="setwon"' : '';
    return '<b'+won+'>'+g+sup+'</b>';
  }).join('') + '</span>';
}
function sideHtml(m, which){
  const p=m[which];
  const cls=['side', p.won?'won':'lost', p.playable?'me':''].filter(Boolean).join(' ');
  return '<div class="'+cls+'">'+seedBox(p)+'<span class="nm">'+p.name+'</span>'+setCells(m,which)+'</div>';
}
const bracket=document.getElementById('bracket');
const scroller=document.querySelector('.scroll');

// ---- the bracket is paged, not scrolled ----------------------------------
// A 128 draw is 7 rounds and ~3,900px tall end to end. Showing all of it at
// once forces the later rounds into enormous vertical gaps, because a column
// of 1 has to span the same height as a column of 64. Showing a WINDOW of 4
// rounds instead means the tallest column in view is the leftmost one, so the
// spacing stays tight and the whole window fits the frame width.
// How many rounds fit: narrow screens get fewer, but never more than MAX_WIN.
// The cap is not about width. A bracket column of one has to span the same
// height as a column of 64, so every extra round on screen stretches the later
// rounds further apart -- the whole draw at once is ~3,900px tall with the final
// marooned in the middle. Four keeps the spacing tight; paging covers the rest.
const MIN_COL = 160, COL_GAP = 10, MAX_WIN = 4;
let WIN = 4;
let LAST = 0;                                    // set once a tournament exists
let start = 0;                                   // opens on the last rounds

function fitWindow(){
  const rounds = D ? D.rounds.length : 7;
  const width = scroller.clientWidth || innerWidth;
  return Math.max(1, Math.min(MAX_WIN, rounds, Math.floor((width + COL_GAP) / (MIN_COL + COL_GAP))));
}

function renderWindow(){
  WIN = fitWindow();
  LAST = Math.max(0, D.rounds.length - WIN);
  start = Math.max(0, Math.min(LAST, start));
  // Keep the eye at roughly the same depth in the draw across a page turn;
  // the content height doubles each step left, so an absolute scrollTop would
  // throw the view to the top.
  const scrollable = scroller.scrollHeight - scroller.clientHeight;
  const frac = scrollable > 1
    ? (scroller.scrollTop + scroller.clientHeight / 2) / scroller.scrollHeight
    : 0.5;

  bracket.innerHTML = D.rounds.slice(start, start + WIN).map((r, i) => {
    const ri = start + i;                        // absolute index: the popup keys off it
    return '<div class="round"><h2>' + LABEL[r.name] + '</h2><div class="ties">' +
      r.matches.map((m, mi) =>
        '<div class="tie" tabindex="0" data-r="' + ri + '" data-m="' + mi + '">' +
        sideHtml(m, 'top') + sideHtml(m, 'bottom') + '</div>').join('') +
      '</div></div>';
  }).join('');

  const view = D.rounds.slice(start, start + WIN);
  document.getElementById('prange').textContent =
    LABEL[view[0].name] + '  \u2192  ' + LABEL[view[view.length - 1].name];
  // With the whole draw on screen there is nothing to page through.
  const whole = WIN >= D.rounds.length;
  document.querySelector('.pager').classList.toggle('whole', whole);
  document.getElementById('prev').disabled = whole || start === 0;
  document.getElementById('next').disabled = whole || start === LAST;

  scroller.scrollLeft = scroller.scrollWidth;   // latest round of the window stays in view
  scroller.scrollTop = Math.max(0, frac * scroller.scrollHeight - scroller.clientHeight / 2);
}
// Where the playable player got to: the last round they appear in, which is
// the final if they won it and their losing match otherwise.
function locatePlayable(){
  if(!D || !D.playable) return null;
  for(let ri = D.rounds.length - 1; ri >= 0; ri--){
    const mi = D.rounds[ri].matches.findIndex(m => m.top.playable || m.bottom.playable);
    if(mi >= 0) return { ri, mi };
  }
  return null;
}
// Page so that round sits at the RIGHT edge of the window, the way the draw
// reads, then centre their tie vertically. Rounds before R16 cannot be the
// rightmost of four, so the window clamps at the start of the draw.
function jumpToPlayable(){
  const at = locatePlayable();
  if(!at) return;
  start = Math.max(0, Math.min(LAST, at.ri - WIN + 1));
  renderWindow();
  const tie = bracket.querySelector('.tie[data-r="' + at.ri + '"][data-m="' + at.mi + '"]');
  if(!tie) return;
  const box = tie.getBoundingClientRect(), frame = scroller.getBoundingClientRect();
  scroller.scrollTop += (box.top - frame.top) - (frame.height - box.height) / 2;
  tie.classList.add('flash');
  setTimeout(() => tie.classList.remove('flash'), 1400);
}

function page(step){
  if(!D) return;
  const next = Math.min(LAST, Math.max(0, start + step));
  if(next === start) return;
  start = next;
  renderWindow();
}
document.getElementById('prev').addEventListener('click', () => page(-1));
document.getElementById('next').addEventListener('click', () => page(1));
addEventListener('keydown', e => {                // arrows page, unless a popup is up
  if(document.getElementById('overlay').classList.contains('open')) return;
  if(document.activeElement === document.getElementById('who')) return;
  if(e.key === 'ArrowLeft')  page(-1);
  if(e.key === 'ArrowRight') page(1);
});

// ---- one popup at a time -------------------------------------------------
const overlay=document.getElementById('overlay');
// points arrive as [sideIndex, shots, runningScore] against the match's two names
function outcome(g){
  if(g.k==='t') return {cls:'tbk',tag:'Tiebreak'};
  return g.win===g.srv ? {cls:'hold',tag:'Hold'} : {cls:'brk',tag:'Break'};
}
// ---- how much to abbreviate ---------------------------------------------
// Nothing is abbreviated unless the panel is too narrow for the line. The
// ladder only shortens what it must, in the order the eye misses least:
//   0  full names throughout
//   1  the score line ("Ad Jessica Pegula" -> "Ad J Pegula")
//   2  the name beside the shot count as well
//   3  surnames clipped to five letters in both
const LEVELS = [
  {score: null, row: null},
  {score: 0,    row: null},
  {score: 0,    row: 0},
  {score: 5,    row: 5},
];
function levelNames(names, level){
  const spec = LEVELS[level];
  return {
    score: spec.score === null ? names : shortNames(names, spec.score),
    row:   spec.row   === null ? names : shortNames(names, spec.row),
  };
}
function rewrite(text, from, to){          // literal replace, names are not patterns
  let out = text;
  for(let i = 0; i < from.length; i++) out = out.split(from[i]).join(to[i]);
  return out;
}

// Measure with the panel's real fonts rather than guessing at character widths.
let gauge = null;
function textWidth(text, font){
  if(!gauge) gauge = document.createElement('canvas').getContext('2d');
  gauge.font = font;
  return gauge.measureText(text).width;
}
// The widest line any point in `games` would need at this level, against the
// width those games actually get.
function fitsAt(games, names, level, available, fonts){
  const n = levelNames(names, level);
  const GAPS = 12;                          // .who gap 4 + .pt gap 8
  for(const g of games){
    for(const p of g.pts){
      const who   = textWidth(n.row[p[0]], fonts.name);
      const count = textWidth(' (' + p[1] + ')', fonts.count);
      const score = textWidth(rewrite(p[2], names, n.score), fonts.score);
      if(who + count + score + GAPS > available) return false;
    }
  }
  return true;
}
function chooseLevel(games, names, available, fonts){
  for(let level = 0; level < LEVELS.length; level++){
    if(fitsAt(games, names, level, available, fonts)) return level;
  }
  return LEVELS.length - 1;                 // nothing fits; clip as hard as we can
}

// full names in the header, clipped ones on the points beneath it
function gameHtml(g, names, head, level){
  const o=outcome(g);
  const n=levelNames(names, level);
  const serve = g.k==='t' ? '' : '<span class="srv">serve <b>'+head[g.srv]+'</b></span>';
  // The shot count is its own element so that a long score line ("Game Set
  // Match ...") clips the NAME rather than eating the count off the end.
  const pts=g.pts.map(p=>'<div class="pt"><span class="who">'+
    '<span class="pn">'+n.row[p[0]]+'</span>'+
    '<span class="n">('+p[1]+')</span></span>'+
    '<span class="sc">'+rewrite(p[2], names, n.score)+'</span></div>').join('');
  return '<div class="game '+o.cls+'"><button class="ghead"><span class="gchev">&#9654;</span>'+
    '<span class="tag">'+o.tag+'</span>'+serve+'<span class="gwin">'+head[g.win]+'</span>'+
    '<span class="gsc">'+g.sc+'</span></button><div class="pts">'+pts+'</div></div>';
}
// Two or four game panels per row, never three and never one where two fit --
// a bracket reads in halves, and an odd column count breaks that rhythm.
const GAME_MIN = 198, GAME_GAP = 7;
// Widest header this match can produce: the longer name in both the serve slot
// and the winner slot, with the widest tag. Measured by laying one out rather
// than adding up guesses, so letter-spacing and font fallbacks are included.
function headerWidth(names, host){
  const longest = names[0].length >= names[1].length ? names[0] : names[1];
  const probe = document.createElement('div');
  probe.className = 'game';
  probe.style.cssText = 'position:absolute;visibility:hidden;width:max-content';
  probe.innerHTML = '<button class="ghead"><span class="gchev">&#9654;</span>' +
    '<span class="tag">Tiebreak</span><span class="srv">serve <b>' + longest + '</b></span>' +
    '<span class="gwin">' + longest + '</span><span class="gsc">6(10)-7</span></button>';
  host.appendChild(probe);
  const width = probe.getBoundingClientRect().width;
  probe.remove();
  return width;
}
// Two or four panels per row, never three. Four only when full names fit that
// narrow; otherwise two wide panels, which read better and leave the header room
// to shorten instead of the layout collapsing to a single column. One column is
// for genuinely narrow screens, not for long names.
function gameColumns(width, names, host){
  const panelAt = k => (width - (k - 1) * GAME_GAP) / k;
  const room = Math.floor((width + GAME_GAP) / (GAME_MIN + GAME_GAP));
  for(const k of [4, 2]) if(k <= room && headerWidth(names, host) <= panelAt(k)) return k;
  return room >= 2 ? 2 : 1;
}

// Headers shorten on the same principle as the points: full names, then first
// initial, then a clipped surname -- each step only if the one before overflows.
const HEADER_LEVELS = [null, 0, 5];
// The point ladder rung that shows the same form as each header rung, so the
// header is never more abbreviated than the rows underneath it.
const HEADER_TO_POINT = [0, 2, 3];
function headerLevelFor(names, host, panel){
  for(let i = 0; i < HEADER_LEVELS.length; i++){
    const shown = HEADER_LEVELS[i] === null ? names : shortNames(names, HEADER_LEVELS[i]);
    if(headerWidth(shown, host) <= panel) return i;
  }
  return HEADER_LEVELS.length - 1;
}
function headerNames(names, level){
  return HEADER_LEVELS[level] === null ? names : shortNames(names, HEADER_LEVELS[level]);
}
// The panel's own fonts, read off a probe rather than assumed.
function panelFonts(host){
  const probe = document.createElement('div');
  probe.className = 'pt';
  probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
  probe.innerHTML = '<span class="who"><span class="pn">x</span>' +
                    '<span class="n">(1)</span></span><span class="sc">0 - 0</span>';
  host.appendChild(probe);
  const font = node => {
    const c = getComputedStyle(node);
    return c.fontStyle + ' ' + c.fontWeight + ' ' + c.fontSize + ' ' + c.fontFamily;
  };
  const fonts = { name: font(probe.querySelector('.pn')),
                  count: font(probe.querySelector('.n')),
                  score: font(probe.querySelector('.sc')) };
  probe.remove();
  return fonts;
}

function open(ri,mi){
  const r=D.rounds[ri], m=r.matches[mi];
  document.getElementById('mround').textContent=LABEL[r.name];
  document.getElementById('mtitle').textContent=m.top.name+' v '+m.bottom.name;
  document.getElementById('mscore').textContent=m.score;

  // Open first: the panel has to be laid out before it can be measured.
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  const body=document.getElementById('mbody');
  const names=[m.top.name,m.bottom.name];

  const width=body.clientWidth;
  const cols=gameColumns(width, names, body);
  body.style.setProperty('--gamecols', cols);
  const fonts=panelFonts(body);
  const PAD=18;                                   // .pts padding, 9px each side
  const panelWidth=(width - (cols-1)*GAME_GAP)/cols;
  const regularWidth=panelWidth - PAD;
  const tiebreakWidth=width - PAD;                // a tiebreak takes the whole row
  const headLevel=headerLevelFor(names, body, panelWidth);
  const head=headerNames(names, headLevel);
  const floor=HEADER_TO_POINT[headLevel];   // points never read longer than the header

  const all=m.sets.flatMap(s=>s.g);
  const regularLevel=Math.max(floor, chooseLevel(all.filter(g=>g.k!=='t'), names, regularWidth, fonts));
  const tiebreakLevel=Math.max(floor, chooseLevel(all.filter(g=>g.k==='t'), names, tiebreakWidth, fonts));

  const sets=m.sets.map((s,i)=>
    '<div class="setrow"><div class="setlabel"><span>Set '+(i+1)+'</span><span class="s">'+s.sc+
    '</span><span style="color:var(--muted)">'+names[s.win]+'</span></div>'+
    '<div class="games">'+s.g.map(g=>
      gameHtml(g,names,head,g.k==='t'?tiebreakLevel:regularLevel)).join('')+'</div></div>').join('');
  const rows=m.stats.map(r=>
    '<div class="srow"><span class="v l'+(r.better==='a'?' best':'')+'">'+r.a+'</span>'+
    '<span class="k">'+r.label+'</span>'+
    '<span class="v r'+(r.better==='b'?' best':'')+'">'+r.b+'</span></div>').join('');
  body.innerHTML = sets +
    '<div class="stats"><h3><span class="who">'+m.statNames[0]+'</span><span>Match statistics</span>'+
    '<span class="who">'+m.statNames[1]+'</span></h3>'+rows+'</div>';
  body.querySelectorAll('.ghead').forEach(h=>
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open')));
  overlay.querySelector('.modal').scrollTop = 0;   // .modal scrolls, not .mbody
}
function close(){ overlay.classList.remove('open'); document.body.style.overflow=''; }
bracket.addEventListener('click',e=>{
  const tie=e.target.closest('.tie'); if(tie) open(+tie.dataset.r,+tie.dataset.m);
});
bracket.addEventListener('keydown',e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const tie=e.target.closest('.tie'); if(tie){ e.preventDefault(); open(+tie.dataset.r,+tie.dataset.m); }
});
document.getElementById('mclose').addEventListener('click',close);
overlay.addEventListener('click',e=>{ if(e.target===overlay) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });

// ---- controls ------------------------------------------------------------
const whoInput = document.getElementById('who');
const whoMenu  = document.getElementById('whoMenu');
const runBtn   = document.getElementById('run');

// Nothing is drawn until the visitor asks for one. An arrival draw they did not
// request reads as a result, and the tour toggle would leave a stale one on
// screen belonging to the other tour.
function setBoardVisible(on){
  document.querySelector('.pager').hidden = !on;
  document.querySelector('.scroll').hidden = !on;
  document.querySelector('.legend').hidden = !on;
  document.getElementById('prompt').hidden = on;
  runBtn.classList.toggle('waiting', !on);
  document.getElementById('simlink').disabled = !on;
}
const article = t => t === 'ATP' ? 'an' : 'a';   // "an ATP", "a WTA"
function clearBoard(message){
  D = null; currentRun = null;
  bracket.innerHTML = '';
  document.getElementById('headline').innerHTML = '';
  document.getElementById('linkbox').hidden = true;
  document.getElementById('prompt').textContent = message;
  setBoardVisible(false);
}

function showTournament(result){
  D = result;
  WIN = fitWindow();
  LAST = Math.max(0, D.rounds.length - WIN);
  start = LAST;
  header();
  setBoardVisible(true);
  renderWindow();
}

const MENU_LIMIT = 60;                 // rendering all 500 on every keystroke is wasteful
function options(query){
  const pool = POOLS[tour];
  const q = query.trim().toLowerCase();
  return q ? pool.filter(p => p.name.toLowerCase().includes(q)) : pool;
}
function renderMenu(query){
  const hits = options(query);
  const rows = hits.slice(0, MENU_LIMIT).map(p =>
    '<div class="opt" data-name="' + p.name.replace(/"/g, '&quot;') + '">' +
    '<span class="rk">' + p.rank + '</span><span>' + p.name + '</span></div>').join('');
  // Say so when the list is cut short. Silently showing the first 60 of 200 reads
  // as "that player is not in the pool" when they are.
  const more = hits.length > MENU_LIMIT
    ? '<div class="opt more"><span class="rk"></span><span class="none">' +
      MENU_LIMIT + ' of ' + hits.length + ' shown &mdash; type to narrow</span></div>' : '';
  whoMenu.innerHTML =
    '<div class="opt" data-name=""><span class="rk">&mdash;</span><span class="none">No player &mdash; just watch</span></div>' +
    (rows || '<div class="opt"><span class="none">No match among the ' + POOLS[tour].length +
             ' ranked ' + tour + ' players</span></div>') + more;
  whoMenu.classList.add('open');
}
function choose(name){
  playable = name || null;
  whoInput.value = playable || '';
  whoMenu.classList.remove('open');
}
whoInput.addEventListener('focus', () => renderMenu(whoInput.value));
whoInput.addEventListener('input', () => renderMenu(whoInput.value));
whoMenu.addEventListener('mousedown', e => {                 // mousedown beats the blur
  const opt = e.target.closest('.opt'); if(!opt || opt.dataset.name === undefined) return;
  e.preventDefault(); choose(opt.dataset.name);
});
whoInput.addEventListener('blur', () => setTimeout(() => whoMenu.classList.remove('open'), 120));
document.getElementById('whoClear').addEventListener('click', () => { choose(''); whoInput.focus(); });

document.querySelectorAll('.segbtn').forEach(btn => btn.addEventListener('click', () => {
  if(btn.dataset.tour === tour) return;
  tour = btn.dataset.tour;
  try { localStorage.setItem(NS + 'tour', tour); } catch (e) { /* private window */ }
  document.querySelectorAll('.segbtn').forEach(b => b.classList.toggle('on', b.dataset.tour === tour));
  // A name only means something within one tour's pool.
  if(playable && !POOLS[tour].some(p => p.name === playable)) choose('');
  whoMenu.classList.remove('open');
  // The draw on screen belongs to the other tour, so it goes.
  clearBoard('Simulate ' + article(tour) + ' ' + tour + ' draw to see the bracket.');
  linkNote('');
}));

// One tournament every 5 seconds. Simulating costs ~40ms, so this is a courtesy
// throttle on a button people will hammer, not a compute limit.
const COOLDOWN = 5000;
let cooling = 0;
function simulate(){
  if(cooling) return;
  runBtn.disabled = true;
  runBtn.textContent = 'Simulating\u2026';
  // Yield once so the button paints its disabled state before the engine runs.
  setTimeout(() => {
    const seed = (Math.random() * 4294967296) >>> 0;
    const result = simulateTournament(POOLS[tour], {
      seed, playable, tour, bestOf: tour === 'ATP' ? 5 : 3, finalSetTiebreak: 10
    });
    currentRun = { seed, tour, playable, cfg: CONFIG };
    showTournament(result);
    recordSim(seed, result);      // only deliberate runs are kept, not the one on arrival
    let left = COOLDOWN;
    runBtn.textContent = 'Simulate again (' + Math.ceil(left / 1000) + 's)';
    cooling = setInterval(() => {
      left -= 1000;
      if(left > 0){ runBtn.textContent = 'Simulate again (' + Math.ceil(left / 1000) + 's)'; return; }
      clearInterval(cooling); cooling = 0;
      runBtn.disabled = false;
      runBtn.textContent = 'Simulate tournament';
    }, 1000);
  }, 16);
}
runBtn.addEventListener('click', simulate);

// Refit on resize, holding the right-hand edge steady so the round you were
// looking at stays put as columns appear or disappear.
let refit;
addEventListener('resize', () => {
  clearTimeout(refit);
  refit = setTimeout(() => {
    if(!D) return;
    const right = start + WIN - 1;
    WIN = fitWindow();
    LAST = Math.max(0, D.rounds.length - WIN);
    start = Math.max(0, Math.min(LAST, right - WIN + 1));
    renderWindow();
  }, 120);
});

document.querySelectorAll('.segbtn').forEach(b =>
  b.classList.toggle('on', b.dataset.tour === tour));


// ---- saved simulations ----------------------------------------------------
// A seed reproduces its tournament only against the same ratings and the same
// engine. The weekly refresh rewrites ratings.json and an engine change moves
// outcomes, so every run is stamped with the configuration it was played under.
// Runs from an older configuration are kept and shown -- their result stands as
// a record -- but they cannot be replayed, because replaying would silently
// produce a different tournament under the same seed.
//
// Bump ENGINE_VERSION whenever a change moves match outcomes (a gradient, the
// shrinkage, the draw); presentation-only changes leave it alone.
const ENGINE_VERSION = 1;
function configStamp(){
  let h = 2166136261;
  const eat = t => { for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } };
  for(const t of ['ATP', 'WTA']){
    eat(t + POOLS[t].length);
    for(const p of POOLS[t]){
      const r = p.ratings;
      eat(p.name + p.rank + r.SRV + ',' + r.RET + ',' + r.SHOT + ',' + r.CONS);
    }
  }
  return 'v' + ENGINE_VERSION + '.' + (h >>> 0).toString(36);
}
const CONFIG = configStamp();

const SIMS_KEY = NS + 'sims', SIMS_MAX = 25;
function loadSims(){
  try {
    const raw = JSON.parse(localStorage.getItem(SIMS_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch (e) { return []; }              // private window, or something else wrote the key
}
function saveSims(list){
  try { localStorage.setItem(SIMS_KEY, JSON.stringify(list)); } catch (e) { /* full or blocked */ }
}
function recordSim(seed, result){
  const list = loadSims();
  list.unshift({ seed, cfg: CONFIG, built: BUILT, tour: result.tour,
                 playable: result.playable, result: result.playableResult,
                 champion: result.champion, championSeed: result.championSeed,
                 at: Date.now() });
  saveSims(list.slice(0, SIMS_MAX));
  renderSims();
}

const simsEl = document.getElementById('sims');
// "26 Aug 2026". Older runs carry the date of the ratings they were played
// against; runs saved before dates were recorded fall back to when they were run.
const DATE_FMT = { day: 'numeric', month: 'short', year: 'numeric' };
function dataDate(entry){
  const iso = entry.built || (entry.at && new Date(entry.at).toISOString().slice(0, 10));
  if(!iso) return 'undated';
  const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
  return isNaN(d) ? 'undated' : d.toLocaleDateString(undefined, DATE_FMT);
}
function renderSims(){
  const list = loadSims();
  const live = list.filter(e => e.cfg === CONFIG).length;
  document.getElementById('simcount').textContent =
    list.length ? 'Saved simulations (' + list.length + ')' : 'Saved simulations';
  simsEl.hidden = false;
  document.getElementById('cfgnote').textContent = list.length
    ? 'Current data set ' + dataDate({ built: BUILT }) + ' \u00b7 ' + CONFIG +
      ' \u2014 ' + live + ' of ' + list.length + ' replayable'
    : '';
  const table = document.getElementById('simtable');
  if(!list.length){ table.innerHTML = ''; return; }
  table.innerHTML =
    '<thead><tr><th>Tour</th><th>Champion</th><th>Seed</th><th>You</th>' +
    '<th>Draw seed</th><th>Data set</th><th></th></tr></thead><tbody>' +
    list.map((e, i) => {
      const replayable = e.cfg === CONFIG;
      return '<tr class="' + (replayable ? 'replay live' : 'stale') + '" data-i="' + i + '">' +
        '<td><span class="tourtag">' + e.tour + '</span></td>' +
        '<td class="champ">' + e.champion + '</td>' +
        '<td>' + (e.championSeed ? '[' + e.championSeed + ']' : '\u2014') + '</td>' +
        '<td>' + (e.playable ? e.playable + ' \u00b7 ' + e.result : '\u2014') + '</td>' +
        '<td class="rng">' + e.seed + '</td>' +
        '<td class="why">' + (replayable ? 'replay' : dataDate(e)) + '</td>' +
        '<td>' + (replayable ? '<button class="link" data-link="' + i + '">Link</button>' : '') +
        '</td></tr>';
    }).join('') + '</tbody>';
}
document.getElementById('simtable').addEventListener('click', ev => {
  const linkBtn = ev.target.closest('button.link');
  if(linkBtn){
    ev.stopPropagation();
    const e = loadSims()[+linkBtn.dataset.link];
    if(e) copyLink({ seed: e.seed, tour: e.tour, playable: e.playable, cfg: e.cfg }, linkBtn);
    return;
  }
  const row = ev.target.closest('tr.replay');
  if(!row) return;
  const entry = loadSims()[+row.dataset.i];
  if(!entry || entry.cfg !== CONFIG) return;
  play(entry);
});
document.getElementById('simclear').addEventListener('click', () => {
  saveSims([]); renderSims();
  document.getElementById('linkbox').hidden = true;
});
document.getElementById('simlink').addEventListener('click', ev => {
  if(currentRun) copyLink(currentRun, ev.currentTarget);
});
renderSims();


// ---- a draw in a link -----------------------------------------------------
// The seed regenerates the whole tournament, so sharing one costs ~37 characters
// rather than the ~950 KB of point records. The configuration stamp travels with
// it: a link made against last week's ratings would otherwise replay as a
// different tournament under the same seed, which is worse than refusing.
let currentRun = null;                       // {seed, tour, playable} now on screen
function encodeRun(r){
  return [r.seed.toString(36), r.tour === 'ATP' ? 'a' : 'w',
          r.cfg || CONFIG, r.playable || ''].join('~');
}
function runUrl(r){ return location.origin + location.pathname + '?r=' + encodeURIComponent(encodeRun(r)); }
function decodeRun(text){
  const parts = String(text).split('~');
  if(parts.length < 3) return null;
  const seed = parseInt(parts[0], 36);
  if(!Number.isFinite(seed)) return null;
  return { seed, tour: parts[1] === 'w' ? 'WTA' : 'ATP', cfg: parts[2],
           playable: parts.slice(3).join('~') || null };
}
function play(run){
  tour = run.tour;
  document.querySelectorAll('.segbtn').forEach(b => b.classList.toggle('on', b.dataset.tour === tour));
  playable = run.playable || null;
  whoInput.value = playable || '';
  currentRun = { seed: run.seed, tour, playable, cfg: CONFIG };
  showTournament(simulateTournament(POOLS[tour], {
    seed: run.seed, playable, tour, bestOf: tour === 'ATP' ? 5 : 3, finalSetTiebreak: 10
  }));
}
function linkNote(text){
  const el = document.getElementById('linknote');
  el.textContent = text || '';
  el.hidden = !text;
}
async function copyLink(run, btn){
  const url = runUrl(run);
  const said = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = said; }, 1400);
  } catch (e) {
    // Clipboard is blocked in some embeds; show it so it can be copied by hand.
    const box = document.getElementById('linkbox');
    box.hidden = false; box.value = url; box.focus(); box.select();
  }
}
function openFromLink(){
  const param = new URLSearchParams(location.search).get('r');
  if(!param) return false;
  const run = decodeRun(param);
  if(!run){ linkNote('That shared link could not be read.'); return false; }
  if(run.cfg !== CONFIG){
    linkNote('This link was made against an older data set, so its draw cannot be '
      + 'reproduced exactly. Showing a fresh tournament instead.');
    return false;
  }
  play(run);
  return true;
}

// A shared draw if the link carries one; otherwise wait to be asked.
if(!openFromLink()){
  clearBoard('Press Simulate tournament to play ' + article(tour) + ' ' + tour + ' draw.');
}

// ---- light / dark ---------------------------------------------------------
// The stylesheet already carries :root[data-theme="dark"] and a
// prefers-color-scheme block guarded by :not([data-theme="light"]), so the
// toggle only has to stamp the root. No stamp at all means "follow the system".
const themeBtn = document.getElementById('theme');
function systemDark(){ return matchMedia('(prefers-color-scheme: dark)').matches; }
function paintTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeBtn.textContent = dark ? '\u2600 Light' : '\u263E Dark';   // what clicking gives you
}
function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem(NS + 'theme', mode); } catch (e) { /* private window */ }
  paintTheme();
}
let stored = null;
try { stored = localStorage.getItem(NS + 'theme'); } catch (e) { /* blocked */ }
setTheme(stored === 'dark' || stored === 'light' ? stored : (systemDark() ? 'dark' : 'light'));
themeBtn.addEventListener('click', () =>
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
</script>
