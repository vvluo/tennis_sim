.scoresbox{border-top:1px solid var(--line)}
.scoresbox > summary{list-style:none;cursor:pointer;padding:11px 16px;font-size:11px;

  display:flex;align-items:center;gap:8px}
.scoresbox > summary::-webkit-details-marker{display:none}
.scoresbox > summary::before{content:"\25B6";font-size:8px;transition:transform .15s}
.scoresbox[open] > summary::before{transform:rotate(90deg)}
.scoresbox > summary:hover{color:var(--ink-2)}
.hulls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;padding:0 16px 16px}

  display:flex;align-items:baseline;gap:8px}
.hull h4 span{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}
.hull .none{margin:0;font-size:12px;font-style:italic;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.sc{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;padding:3px 7px;
  border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}

.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.srow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:baseline;
  padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.srow:last-child{border-bottom:0}
.srow .k{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.srow .v{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.srow .v.l{text-align:right}
.srow .v.best{color:var(--ink);font-weight:700}
.srow.names{border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:2px}
.srow.names .v{color:var(--ink);font-weight:700;font-size:12px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats h3 .who{color:var(--ink);text-transform:none;font-size:12.5px;letter-spacing:-.01em}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.5px;font-style:italic}

<div class="wrap">
<header>
  <div class="titlerow">

<div class="card">

  <div class="pad">
    <div class="row">

        <label class="clab" for="tourseg">Tour</label>
        <div class="seg" id="tourseg" role="group" aria-label="Tour">

        <input type="number" id="n" min="1" max="100" step="1" value="10"></div>

    <div class="row" style="margin-top:14px">
      <div class="ctl"><label class="clab" for="surface">Surface</label>
        <select id="surface">
          <option value="hard">Hard</option>
          <option value="clay">Clay</option>
          <option value="grass">Grass</option>
        </select></div>
      <div class="ctl"><label class="clab" for="bestof">Format</label>
        <select id="bestof">
          <option value="3">Best of 3</option>

        </select></div>
      <div class="ctl"><label class="clab" for="deuce">Deuce</label>
        <select id="deuce">
          <option value="ad">Advantage</option>

        </select></div>
      <div class="ctl"><label class="clab" for="gps">Sets to</label>
        <input type="number" id="gps" min="1" max="12" step="1" value="6"></div>
      <div class="ctl"><label class="clab" for="tb">Tiebreak to</label>
        <input type="number" id="tb" min="1" max="30" step="1" value="7"></div>
      <div class="ctl"><label class="clab" for="dtb">Final set to</label>
        <input type="number" id="dtb" min="1" max="30" step="1" value="10"></div>
      <div class="ctl"><label class="clab">&nbsp;</label>
        <label class="check"><input type="checkbox" id="stb">
          <span>Super tiebreak final set</span></label></div>
      <div class="ctl"><label class="clab">&nbsp;</label>
        <button class="go" id="go" type="button">Simulate</button></div>

<div id="out"></div>

<script>
/*__ENGINE__*/
/*__FORECAST__*/
</script>
<script>
const DATA = /*__DATA__*/;
const POOLS = DATA.pools, BUILT = DATA.built;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const state = { tour: 'ATP' };

function fillPlayers(){
  const pool = POOLS[state.tour];
  const opts = pool.map(p =>
    '<option value="' + esc(p.name) + '">' + esc(p.name) + '  (#' + p.rank + ')</option>').join('');
  $('pa').innerHTML = opts; $('pb').innerHTML = opts;
  $('pa').value = pool[0].name;
  $('pb').value = (pool[1] || pool[0]).name;
}

// How wide a win was, in the order the tie is broken: sets, then games, then
// points. Returned as one array so comparing two wins is a plain lexicographic
// walk -- adding a further tiebreaker later means appending to this, nothing else.
function margin(sets, winner){
  const s = [0, 0], g = [0, 0], p = [0, 0];
  sets.forEach(set => {
    s[set.win]++;
    set.games.forEach(gm => {
      g[gm.win]++;
      gm.pts.forEach(pt => p[pt[0]]++);
    });
  });
  const other = 1 - winner;
  return [s[winner] - s[other], g[winner] - g[other], p[winner] - p[other]];
}
const wider = (a, b) => {                 // a beats b?
  for(let i = 0; i < a.length; i++) if(a[i] !== b[i]) return a[i] > b[i];
  return false;
};

function run(){
  const names = [$('pa').value, $('pb').value];
  if(names[0] === names[1]){ $('hint').textContent = 'Pick two different players.'; return; }
  const pool = POOLS[state.tour];
  const ent = names.map(n => pool.find(p => p.name === n));
  const n = Math.max(1, Math.min(100, Math.round(+$('n').value) || 10));
  $('n').value = n;
  const cfg = {
    surface: $('surface').value,
    bestOf: +$('bestof').value,
    noAd: $('deuce').value === 'noad',
    gamesPerSet: Math.max(1, Math.round(+$('gps').value) || 6),
    tiebreak: Math.max(1, Math.round(+$('tb').value) || 7),
    deciding: Math.max(1, Math.round(+$('dtb').value) || 10),
    superTiebreak: $('stb').checked,
  };
  const base = basesFor(state.tour, cfg.surface);
  const shrink = SHRINK[state.tour] ?? 1.0;
  // Both players are lifted to the same reference level the other pages use, so
  // a matchup here reads the same way as the same pair inside a draw.
  const mean = ent.reduce((a, e) =>
    a + (e.ratings.SRV + e.ratings.RET + e.ratings.SHOT + e.ratings.CONS) / 4, 0) / 2;
  const shift = 5.0 - mean;
  const players = ent.map(e => toPlayer(e, shift, shrink));

  const rng = makeRandom((Math.random() * 0xFFFFFFFF) >>> 0);
  const wins = [0, 0], lines = [];
  const total = { st: null, bestPt: [0, 0], bestGm: [0, 0] };
  const best = [null, null];
  for(let i = 0; i < n; i++){
    const played = simMatch(rng, players[0], players[1], names, cfg.bestOf,
                            cfg.deciding, base, cfg);
    const w = played.winner;
    wins[w]++;
    lines.push({ w, score: setScoreStrings(played.sets, w, names) });
    const raw = rawStats(played.sets);
    if(!total.st){ total.st = {}; for(const k in raw.st) total.st[k] = [0, 0]; }
    for(const k in raw.st){ total.st[k][0] += raw.st[k][0]; total.st[k][1] += raw.st[k][1]; }
    // A streak is a maximum, so it is summed and averaged like any other count
    total.bestPt[0] += raw.bestPt[0]; total.bestPt[1] += raw.bestPt[1];
    total.bestGm[0] += raw.bestGm[0]; total.bestGm[1] += raw.bestGm[1];
    const m = margin(played.sets, w);
    if(!best[w] || wider(m, best[w].margin))
      best[w] = { margin: m, stats: matchStats(played.sets, names),
                  score: setScoreStrings(played.sets, w, names) };
  }

  const avg = formatStats(total.st, total.bestPt, total.bestGm, n);
  render(names, wins, lines, avg, best, n, cfg);
}

// Every scoreline, folded away until asked for, and split by who won it: one
// outlined block per player rather than a hundred chips in one run.
function scoreLines(names, wins, lines){
  const hull = side => {
    const mine = lines.filter(l => l.w === side);
    return '<div class="hull ' + (side === 0 ? 'a' : 'b') + '">' +
      '<h4>' + esc(names[side]) + '<span>' + wins[side] +
      (wins[side] === 1 ? ' win' : ' wins') + '</span></h4>' +
      (mine.length
        ? '<div class="chips">' + mine.map(l =>
            '<span class="sc">' + esc(l.score) + '</span>').join('') + '</div>'
        : '<p class="none">No wins.</p>') + '</div>';
  };
  return '<details class="scoresbox"><summary>Scorelines &middot; ' + lines.length +
    (lines.length === 1 ? ' match' : ' matches') + '</summary>' +
    '<div class="hulls">' + hull(0) + hull(1) + '</div></details>';
}

function statBlock(title, rows, sub, names){
  if(!rows) return '<div class="card stats"><h3>' + title + '</h3>' +
    '<div class="empty">' + esc(sub) + '</div></div>';
  // Which column is whose. Obvious on the average block, where the heading names
  // both; not at all obvious on a best-win block, whose heading names only one.
  const heads = names
    ? '<div class="srow names"><span class="v l">' + esc(names[0]) + '</span>' +
      '<span class="k"></span><span class="v">' + esc(names[1]) + '</span></div>'
    : '';
  return '<div class="card stats"><h3>' + title + '</h3><div class="pad">' +
    (sub ? '<p class="hint" style="margin:0 0 8px">' + esc(sub) + '</p>' : '') + heads +
    rows.map(r => '<div class="srow"><span class="v l' + (r.better === 'a' ? ' best' : '') +
      '">' + esc(r.a) + '</span><span class="k">' + esc(r.label) + '</span>' +
      '<span class="v' + (r.better === 'b' ? ' best' : '') + '">' + esc(r.b) +
      '</span></div>').join('') + '</div></div>';
}

function render(names, wins, lines, avg, best, n, cfg){
  const pct = i => Math.round(1000 * wins[i] / n) / 10;
  const rule = [cfg.surface, 'best of ' + cfg.bestOf,
                cfg.noAd ? 'deciding point' : 'advantage',
                'sets to ' + cfg.gamesPerSet, 'tiebreak to ' + cfg.tiebreak,
                cfg.superTiebreak ? 'super tiebreak to ' + cfg.deciding
                                  : 'final set to ' + cfg.deciding].join(' · ');
  $('out').innerHTML =
    '<div class="card"><h3>' + n + ' matches &middot; ' + esc(rule) + '</h3>' +
    '<div class="verdict">' +
      '<div class="vside"><div class="vname">' + esc(names[0]) + '</div>' +
        '<div class="vwins">' + wins[0] + '</div>' +
        '<div class="vpct">' + pct(0) + '%</div></div>' +
      '<div class="vmid">wins</div>' +
      '<div class="vside b"><div class="vname">' + esc(names[1]) + '</div>' +
        '<div class="vwins">' + wins[1] + '</div>' +
        '<div class="vpct">' + pct(1) + '%</div></div>' +
      '<div class="bar"><i style="width:' + pct(0) + '%"></i></div>' +
    '</div>' +
    scoreLines(names, wins, lines) + '</div>' +
    statBlock('Average match', avg,
      'Per match over ' + n + '. Rates are pooled across all of them.', names) +
    '<div class="panes">' +
      statBlock('Best win &mdash; ' + esc(names[0]),
        best[0] && best[0].stats,
        best[0] ? best[0].score : names[0] + ' did not win a match.', names) +
      statBlock('Best win &mdash; ' + esc(names[1]),
        best[1] && best[1].stats,
        best[1] ? best[1].score : names[1] + ' did not win a match.', names) +
    '</div>';
  $('hint').textContent = 'Data set ' + BUILT + '.';
}

document.querySelectorAll('#tourseg .segbtn').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('#tourseg .segbtn').forEach(x => x.classList.toggle('on', x === b));
    state.tour = b.dataset.tour;
    fillPlayers();
    $('out').innerHTML = '';
  }));
$('go').addEventListener('click', run);

// theme, shared with the other pages through the same key
const NS = 'tennis-sim:';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  $('theme').textContent = t === 'dark' ? '☀' : '☽';
  try { localStorage.setItem(NS + 'theme', t); } catch(e){}
}
let theme = 'light';
try { theme = localStorage.getItem(NS + 'theme') || 'light'; } catch(e){}
applyTheme(theme);
$('theme').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(theme);
});

fillPlayers();
$('hint').textContent = 'Data set ' + BUILT + '.';
</script>
